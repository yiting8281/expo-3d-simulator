        function handleFaceUpload(event) {
            let file = event.target.files[0];
            if (!file || !selectedObject) return;
            let reader = new FileReader();
            reader.onload = function(e) {
                let base64Data = e.target.result;

                if (currentTargetUploadFace === 'custom_group') {
                    let checkboxes = document.querySelectorAll('.wall-custom-checkbox:checked');
                    let selectedSegmentIds = Array.from(checkboxes).map(cb => cb.value);
                    if (selectedSegmentIds.length > 0) {
                        let wallMode = document.getElementById('booth-wall-mode-select')?.value || 'full_span';
                        let dir = selectedObject.userData.dir;
                        let matchedBaseWalls = wallObjects.filter(w => selectedSegmentIds.includes(w.userData.segmentId) && w.userData.type === 'booth_wall');
                        let matchedTopWalls = wallObjects.filter(w => selectedSegmentIds.includes(w.userData.segmentId) && w.userData.type === 'booth_wall_top');

                        if (dir === 'back' || dir === 'front') {
                            matchedBaseWalls.sort((a, b) => a.userData.c - b.userData.c);
                            matchedTopWalls.sort((a, b) => a.userData.c - b.userData.c);
                        } else {
                            matchedBaseWalls.sort((a, b) => a.userData.r - b.userData.r);
                            matchedTopWalls.sort((a, b) => a.userData.r - b.userData.r);
                        }

                        if (wallMode === 'full_span' && matchedTopWalls.length > 0) {
                            applyCustomGroupTextureToWallsSpan(matchedBaseWalls, matchedTopWalls, base64Data);
                        } else if (wallMode === 'top_only' && matchedTopWalls.length > 0) {
                            applyCustomGroupTextureToWalls(matchedTopWalls, base64Data, true);
                        } else {
                            applyCustomGroupTextureToWalls(matchedBaseWalls, base64Data, false);
                        }
                    }
                } else if (currentTargetUploadFace === 'group_fitting') {
                    let frObjects = draggableObjects.filter(o => o.userData.type === 'fitting_room');
                    if (frObjects.length > 0) {
                        frObjects.sort((a, b) => a.position.x - b.position.x);
                        applyGroupTextureToFittingRooms(frObjects, base64Data);
                    }
                } else if (currentTargetUploadFace === 'group_cabinet') {
                    let checkboxes = document.querySelectorAll('.cabinet-custom-checkbox:checked');
                    let selectedIds = Array.from(checkboxes).map(cb => cb.value);
                    let cabObjects = draggableObjects.filter(o => selectedIds.includes(o.id.toString()));
                    if (cabObjects.length > 0) {
                        cabObjects.sort((a, b) => a.position.x - b.position.x);
                        applyGroupTextureToCabinets(cabObjects, base64Data);
                    }
                } else if (selectedObject.userData.type === 'booth_wall' || selectedObject.userData.type === 'booth_wall_top') {
                    let segId = selectedObject.userData.segmentId;
                    if (!elevatedWallSegments[segId]) elevatedWallSegments[segId] = { hasTop: (selectedObject.userData.type === 'booth_wall_top'), img: null, baseImg: null };
                    if (selectedObject.userData.type === 'booth_wall_top') {
                        elevatedWallSegments[segId].img = base64Data;
                        applyTextureToWallTop(selectedObject, base64Data);
                    } else {
                        elevatedWallSegments[segId].baseImg = base64Data;
                        applyTextureToWallBase(selectedObject, base64Data);
                    }
                } else {
                    if (!selectedObject.userData.images) selectedObject.userData.images = {};
                    selectedObject.userData.images[currentTargetUploadFace] = base64Data;
                    applyTextureToFace(selectedObject, currentTargetUploadFace, base64Data);
                }

                saveToLocalStorage();
                selectObject(selectedObject);
                event.target.value = '';
            };
            reader.readAsDataURL(file);
        }

        /* 跨圖大圖裁切演算法 */
        function applyCustomGroupTextureToWalls(wallMeshes, base64Data, isTopLayer) {
            let img = new Image();
            img.onload = function() {
                let totalCount = wallMeshes.length;
                let canvasW = 1024 * totalCount;
                let canvasH = isTopLayer ? 512 : 1024;
                let masterCanvas = document.createElement('canvas');
                let masterCtx = masterCanvas.getContext('2d');
                masterCanvas.width = canvasW; masterCanvas.height = canvasH;
                masterCtx.fillStyle = '#545454'; masterCtx.fillRect(0, 0, canvasW, canvasH);
                masterCtx.drawImage(img, 0, 0, canvasW, canvasH);

                wallMeshes.forEach((mesh, index) => {
                    let subCanvas = document.createElement('canvas');
                    let subCtx = subCanvas.getContext('2d');
                    subCanvas.width = 1024; subCanvas.height = canvasH;
                    subCtx.drawImage(masterCanvas, index * 1024, 0, 1024, canvasH, 0, 0, 1024, canvasH);
                    let texture = new THREE.CanvasTexture(subCanvas);
                    texture.encoding = THREE.sRGBEncoding;

                    if (Array.isArray(mesh.material)) {
                        mesh.material[4].map = texture;
                        mesh.material[4].color.setHex(0xffffff);
                        mesh.material[4].needsUpdate = true;
                    }
                    let segId = mesh.userData.segmentId;
                    if (segId) {
                        if (!elevatedWallSegments[segId]) elevatedWallSegments[segId] = { hasTop: true, img: null, baseImg: null };
                        if (isTopLayer) elevatedWallSegments[segId].img = subCanvas.toDataURL('image/jpeg', 0.8);
                        else elevatedWallSegments[segId].baseImg = subCanvas.toDataURL('image/jpeg', 0.8);
                    }
                });
                saveToLocalStorage();
            };
            img.src = base64Data;
        }

        function applyCustomGroupTextureToWallsSpan(baseWalls, topWalls, base64Data) {
            let img = new Image();
            img.onload = function() {
                let totalCount = baseWalls.length;
                let canvasW = 1024 * totalCount;
                let canvasH = 1024;
                let masterCanvas = document.createElement('canvas');
                let masterCtx = masterCanvas.getContext('2d');
                masterCanvas.width = canvasW; masterCanvas.height = canvasH;
                masterCtx.fillStyle = '#545454'; masterCtx.fillRect(0, 0, canvasW, canvasH);
                masterCtx.drawImage(img, 0, 0, canvasW, canvasH);

                baseWalls.forEach((baseMesh, index) => {
                    let segId = baseMesh.userData.segmentId;
                    let topMesh = topWalls.find(t => t.userData.segmentId === segId);
                    if (!elevatedWallSegments[segId]) elevatedWallSegments[segId] = { hasTop: true, img: null, baseImg: null };

                    let colCanvas = document.createElement('canvas');
                    let colCtx = colCanvas.getContext('2d');
                    colCanvas.width = 1024; colCanvas.height = 1024;
                    colCtx.drawImage(masterCanvas, index * 1024, 0, 1024, 1024, 0, 0, 1024, 1024);

                    let baseCanvas = document.createElement('canvas');
                    let baseCtx = baseCanvas.getContext('2d');
                    baseCanvas.width = 1024; baseCanvas.height = 1024;
                    baseCtx.drawImage(colCanvas, 0, 1024 * 0.375, 1024, 1024 * 0.625, 0, 0, 1024, 1024);
                    let baseBase64 = baseCanvas.toDataURL('image/jpeg', 0.8);
                    elevatedWallSegments[segId].baseImg = baseBase64;
                    applyTextureToWallBase(baseMesh, baseBase64);

                    if (topMesh) {
                        let topCanvas = document.createElement('canvas');
                        let topCtx = topCanvas.getContext('2d');
                        topCanvas.width = 1024; topCanvas.height = 512;
                        topCtx.drawImage(colCanvas, 0, 0, 1024, 1024 * 0.375, 0, 0, 1024, 512);
                        let topBase64 = topCanvas.toDataURL('image/jpeg', 0.8);
                        elevatedWallSegments[segId].img = topBase64;
                        applyTextureToWallTop(topMesh, topBase64);
                    }
                });
                saveToLocalStorage();
            };
            img.src = base64Data;
        }

        function applyGroupTextureToCabinets(cabinets, base64Data) {
            let img = new Image();
            img.onload = function() {
                let totalWidth = cabinets.reduce((sum, mesh) => sum + (mesh.userData.customW || 1.0), 0);
                let canvasW = 1024 * cabinets.length;
                let canvasH = 1024;
                let masterCanvas = document.createElement('canvas');
                let masterCtx = masterCanvas.getContext('2d');
                masterCanvas.width = canvasW; masterCanvas.height = canvasH;
                masterCtx.fillStyle = '#545454'; masterCtx.fillRect(0, 0, canvasW, canvasH);
                masterCtx.drawImage(img, 0, 0, canvasW, canvasH);

                let currentXPixel = 0;
                cabinets.forEach((mesh) => {
                    let w = mesh.userData.customW || 1.0;
                    let pixelWidth = (w / totalWidth) * canvasW;
                    let subCanvas = document.createElement('canvas');
                    let subCtx = subCanvas.getContext('2d');
                    subCanvas.width = 1024; subCanvas.height = canvasH;
                    subCtx.drawImage(masterCanvas, currentXPixel, 0, pixelWidth, canvasH, 0, 0, 1024, canvasH);
                    let slicedBase64 = subCanvas.toDataURL('image/jpeg', 0.8);
                    if(!mesh.userData.images) mesh.userData.images = {};
                    mesh.userData.images['front'] = slicedBase64;
                    applyTextureToFace(mesh, 'front', slicedBase64);
                    currentXPixel += pixelWidth;
                });
                saveToLocalStorage();
            };
            img.src = base64Data;
        }

        function applyGroupTextureToFittingRooms(fittingRooms, base64Data) {
            let img = new Image();
            img.onload = function() {
                let totalCount = fittingRooms.length;
                let canvasW = 1024 * totalCount;
                let canvasH = 512;
                let masterCanvas = document.createElement('canvas');
                let masterCtx = masterCanvas.getContext('2d');
                masterCanvas.width = canvasW; masterCanvas.height = canvasH;
                masterCtx.fillStyle = '#545454'; masterCtx.fillRect(0, 0, canvasW, canvasH);
                masterCtx.drawImage(img, 0, 0, canvasW, canvasH);

                fittingRooms.forEach((mesh, index) => {
                    let subCanvas = document.createElement('canvas');
                    let subCtx = subCanvas.getContext('2d');
                    subCanvas.width = 1024; subCanvas.height = canvasH;
                    subCtx.drawImage(masterCanvas, index * 1024, 0, 1024, canvasH, 0, 0, 1024, canvasH);
                    let slicedBase64 = subCanvas.toDataURL('image/jpeg', 0.8);
                    if(!mesh.userData.images) mesh.userData.images = {};
                    mesh.userData.images['front'] = slicedBase64;

                    if (!mesh.userData.hasTopLayer) {
                        let pos = { x: mesh.position.x, y: 1.25, z: mesh.position.z };
                        let rot = { x: mesh.rotation.x, y: mesh.rotation.y, z: mesh.rotation.z };
                        let dims = { w: mesh.userData.customW, d: mesh.userData.customD, h: mesh.userData.customH };
                        scene.remove(mesh);
                        draggableObjects = draggableObjects.filter(o => o !== mesh);
                        createObject('fitting_room', pos, rot, false, mesh.userData.images, true, 3, dims);
                    } else {
                        applyTextureToFace(mesh, 'front', slicedBase64);
                    }
                });
                saveToLocalStorage();
            };
            img.src = base64Data;
        }

        /* 隔牆加高控制 */
        function toggleWallSegmentHeight() {
            if (!selectedObject) return;
            let segId = selectedObject.userData.segmentId;
            if (!segId) return;

            if (!elevatedWallSegments[segId]) {
                elevatedWallSegments[segId] = { hasTop: true, img: null, baseImg: null };
            } else {
                elevatedWallSegments[segId].hasTop = !elevatedWallSegments[segId].hasTop;
            }

            render3DFloor();
            let newObj = wallObjects.find(w => w.userData.segmentId === segId);
            if (newObj) selectObject(newObj);

        function removeSelectedWallSegment() {
            if (!selectedObject) return;
            let segId = selectedObject.userData.segmentId;
            if (segId && !disabledWallSegments.includes(segId)) {
                disabledWallSegments.push(segId);
            }
            selectObject(null);
            render3DFloor();
            saveToLocalStorage();
        }

        /* 背板 / 更衣室加高控制 */
        function toggleBackdropLayer() {
            if (!selectedObject) return;
            let type = selectedObject.userData.type;
            if (type !== 'backdrop' && type !== 'fitting_room') return;

            let currentState = selectedObject.userData.hasTopLayer || false;
            let newState = !currentState;

            let newH = (type === 'backdrop' && newState) ? 4.0 : 2.5;
            let posY = (type === 'fitting_room') ? 1.25 : (newH / 2);

            let pos = { x: selectedObject.position.x, y: posY, z: selectedObject.position.z };
            let rot = { x: selectedObject.rotation.x, y: selectedObject.rotation.y, z: selectedObject.rotation.z };
            let imgs = selectedObject.userData.images;
            let shelfLayers = selectedObject.userData.shelfLayers;
            let dims = { 
                w: selectedObject.userData.customW || OBJECT_TYPES[type].w, 
                d: selectedObject.userData.customD || OBJECT_TYPES[type].d, 
                h: newH 
            };

            scene.remove(selectedObject);
            draggableObjects = draggableObjects.filter(o => o !== selectedObject);

            createObject(type, pos, rot, true, imgs, newState, shelfLayers, dims);
        }

        function adjustShelfLayers(delta) {
            if (!selectedObject || selectedObject.userData.type !== 'wall_shelf') return;
            let currentLayers = selectedObject.userData.shelfLayers || 3;
            let newLayers = currentLayers + delta;
            if (newLayers < 1 || newLayers > 6) return;

            let type = selectedObject.userData.type;
            let data = OBJECT_TYPES[type];
            let curW = selectedObject.userData.customW || data.w;
            let curD = selectedObject.userData.customD || data.d;
            let curH = selectedObject.userData.customH || data.h;

            while(selectedObject.children.length > 0){
                selectedObject.remove(selectedObject.children[0]);
            }

            let newShelfGroup = createShelfGeometry(data, newLayers, curW, curD, curH);
            selectedObject.add(newShelfGroup);
            selectedObject.userData.shelfLayers = newLayers;

            selectObject(selectedObject);
            saveToLocalStorage();
        }

        function applyTextureToWallBase(mesh, base64Data) {
            let img = new Image();
            img.onload = function() {
                let canvas = document.createElement('canvas');
                let ctx = canvas.getContext('2d');
                canvas.width = 1024; canvas.height = 1024;
                ctx.fillStyle = '#545454'; ctx.fillRect(0, 0, 1024, 1024);
                ctx.drawImage(img, 0, 0, 1024, 1024);
                let texture = new THREE.CanvasTexture(canvas);
                texture.encoding = THREE.sRGBEncoding;
                if (Array.isArray(mesh.material)) {
                    mesh.material[4].map = texture;
                    mesh.material[4].color.setHex(0xffffff);
                    mesh.material[4].needsUpdate = true;
                }
            };
            img.src = base64Data;
        }

        function applyTextureToWallTop(mesh, base64Data) {
            let img = new Image();
            img.onload = function() {
                let canvas = document.createElement('canvas');
                let ctx = canvas.getContext('2d');
                canvas.width = 1024; canvas.height = 512;
                ctx.fillStyle = '#545454'; ctx.fillRect(0, 0, 1024, 512);
                ctx.drawImage(img, 0, 0, 1024, 512);
                let texture = new THREE.CanvasTexture(canvas);
                texture.encoding = THREE.sRGBEncoding;
                if (Array.isArray(mesh.material)) {
                    mesh.material[4].map = texture;
                    mesh.material[4].color.setHex(0xffffff);
                    mesh.material[4].needsUpdate = true;
                }
            };
            img.src = base64Data;
        }

        function applyTextureToFace(mesh, face, base64Data) {
            if (!mesh) return;
            let type = mesh.userData.type;
            let img = new Image();
            img.onload = function() {
                let canvas = document.createElement('canvas');
                let ctx = canvas.getContext('2d');
                canvas.width = 1024; canvas.height = 1024;
                ctx.fillStyle = '#545454'; ctx.fillRect(0, 0, 1024, 1024);
                ctx.drawImage(img, 0, 0, 1024, 1024);
                let texture = new THREE.CanvasTexture(canvas);
                texture.encoding = THREE.sRGBEncoding;

                if (type === 'fitting_room') {
                    if (face === 'front') {
                        let topBanner = mesh.getObjectByName('topBannerMesh');
                        if (topBanner) {
                            topBanner.material[4].map = texture;
                            topBanner.material[4].color.setHex(0xffffff);
                            topBanner.material[4].needsUpdate = true;
                        }
                    } else {
                        let targetWallName = (face === 'left') ? 'leftWallMesh' : 'rightWallMesh';
                        let targetWall = mesh.getObjectByName(targetWallName);
                        if (targetWall) {
                            targetWall.material.map = texture;
                            targetWall.material.color.setHex(0xffffff);
                            targetWall.material.needsUpdate = true;
                        }
                    }
                } else if (Array.isArray(mesh.material)) {
                    let faceIdx = (face === 'left') ? 1 : (face === 'right') ? 0 : 4;
                    mesh.material[faceIdx].map = texture;
                    mesh.material[faceIdx].color.setHex(0xffffff);
                    mesh.material[faceIdx].needsUpdate = true;
                }
            };
            img.src = base64Data;
        }

        /* 3D 畫布專屬觸控事件 */
        function onCanvasPointerDown(event) {
            let drawer = document.getElementById('mobile-drawer');
            let rect = drawer.getBoundingClientRect();
            if (!drawer.classList.contains('collapsed') && event.clientY >= rect.top) {
                return;
            }

            let raycaster = new THREE.Raycaster();
            let mouse = new THREE.Vector2(
                (event.clientX / window.innerWidth) * 2 - 1,
                -(event.clientY / window.innerHeight) * 2 + 1
            );
            raycaster.setFromCamera(mouse, camera);
            let targets = [...draggableObjects, ...wallObjects];
            let intersects = raycaster.intersectObjects(targets, true);

            if (intersects.length > 0) {
                let hit = intersects[0].object;
                while (hit.parent && hit.parent !== scene && !hit.userData.type) {
                    hit = hit.parent;
                }
                selectObject(hit);
                if (hit.userData.type !== 'booth_wall' && hit.userData.type !== 'booth_wall_top') {
                    isDragging = true;
                    orbitControls.enabled = false;
                    let intersectionPoint = new THREE.Vector3();
                    raycaster.ray.intersectPlane(planeHelper, intersectionPoint);
                    dragOffset.copy(selectedObject.position).sub(intersectionPoint);
                }
            } else {
                if (!isDragging) selectObject(null);
            }
        }

        function onCanvasPointerMove(event) {
            if (!isDragging || !selectedObject) return;
            let raycaster = new THREE.Raycaster();
            let mouse = new THREE.Vector2(
                (event.clientX / window.innerWidth) * 2 - 1,
                -(event.clientY / window.innerHeight) * 2 + 1
            );
            raycaster.setFromCamera(mouse, camera);
            let intersectionPoint = new THREE.Vector3();
            if (raycaster.ray.intersectPlane(planeHelper, intersectionPoint)) {
                selectedObject.position.x = Math.round((intersectionPoint.x + dragOffset.x) * 10) / 10;
                selectedObject.position.z = Math.round((intersectionPoint.z + dragOffset.z) * 10) / 10;
            }
        }

        function onCanvasPointerUp() {
            isDragging = false;
            orbitControls.enabled = true;
            saveToLocalStorage();
        }

        function onKeyDown(event) {
            if (!selectedObject) return;
            if (event.key.toLowerCase() === 'r') {
                selectedObject.rotation.y += Math.PI / 2;
                saveToLocalStorage();
            } else if (event.key === 'Delete' || event.key === 'Backspace') {
                if (selectedObject.userData.type === 'booth_wall' || selectedObject.userData.type === 'booth_wall_top') {
                    removeSelectedWallSegment();
                } else {
                    scene.remove(selectedObject);
                    draggableObjects = draggableObjects.filter(o => o !== selectedObject);
                    selectObject(null);
                    saveToLocalStorage();
                }
            } else if (event.key.toLowerCase() === 'c') {
                let type = selectedObject.userData.type;
                createObject(type, { x: selectedObject.position.x + 0.5, z: selectedObject.position.z + 0.5 });
            }
        }

        function updateSelectedDimensions() {
            if (!selectedObject || selectedObject.userData.type === 'booth_wall') return;
            let w = parseFloat(document.getElementById('dim-w').value) / 100;
            let d = parseFloat(document.getElementById('dim-d').value) / 100;
            let h = parseFloat(document.getElementById('dim-h').value) / 100;
            if (w > 0 && d > 0 && h > 0) {
                let type = selectedObject.userData.type;
                let pos = { x: selectedObject.position.x, y: h / 2, z: selectedObject.position.z };
                let rot = { x: selectedObject.rotation.x, y: selectedObject.rotation.y, z: selectedObject.rotation.z };
                let imgs = selectedObject.userData.images;
                let hasTop = selectedObject.userData.hasTopLayer;
                let shelfLayers = selectedObject.userData.shelfLayers;

                scene.remove(selectedObject);
                draggableObjects = draggableObjects.filter(o => o !== selectedObject);
                createObject(type, pos, rot, true, imgs, hasTop, shelfLayers, { w, d, h });
            }
        }

        function switchView(type) {
            if (type === 'reset') camera.position.set(0, 14, 16);
            else if (type === 'top') camera.position.set(0, 20, 0.01);
            else if (type === 'front') camera.position.set(0, 2, 16);
            else if (type === 'left') camera.position.set(-16, 2, 0);
            orbitControls.target.set(0, 0, 0);
        }

        /* -------------------------------------------------------------
           單一佈局存檔與匯入/匯出邏輯 (精簡版)
        ------------------------------------------------------------- */
        function initLayout() {
            let stored = localStorage.getItem('expo_mobile_save');

                try {
                    let parsed = JSON.parse(stored);
                    applyProjectDataToScene(parsed);
                    return;
                } catch(e) {
                    console.error("載入暫存失敗：", e);

            }
            render3DFloor();
        }

                showFasciaLeft: document.getElementById('fascia-left-check')?.checked ?? true,

                }))
            };
        }

        function saveToLocalStorage() {
            let data = getCurrentSceneData();
            localStorage.setItem('expo_mobile_save', JSON.stringify(data));
        }

        function applyProjectDataToScene(data) {
            selectObject(null);
            activeFloorGrid = data.activeFloorGrid || ['2-2', '2-3'];
            document.querySelectorAll('.grid-cell').forEach(c => c.classList.remove('active'));
            activeFloorGrid.forEach(gridId => {
                let cell = document.getElementById(`cell-${gridId}`);
                if (cell) cell.classList.add('active');
            });

            if (data.floorColor) {
                currentFloorColorHex = data.floorColor;
                let colorInput = document.getElementById('floor-color-input');
                if (colorInput) colorInput.value = data.floorColor;
            }

            if (document.getElementById('show-frame-check')) document.getElementById('show-frame-check').checked = (data.showFrame !== undefined) ? data.showFrame : true;
            if (document.getElementById('show-fascia-check')) document.getElementById('show-fascia-check').checked = (data.showFascia !== undefined) ? data.showFascia : true;
            if (document.getElementById('show-main-grid-check')) document.getElementById('show-main-grid-check').checked = (data.showMainGrid !== undefined) ? data.showMainGrid : true;
            if (document.getElementById('show-sub-grid-check')) document.getElementById('show-sub-grid-check').checked = (data.showSubGrid !== undefined) ? data.showSubGrid : true;

            if (document.getElementById('fascia-front-check')) document.getElementById('fascia-front-check').checked = (data.showFasciaFront !== undefined) ? data.showFasciaFront : true;
            if (document.getElementById('fascia-back-check')) document.getElementById('fascia-back-check').checked = (data.showFasciaBack !== undefined) ? data.showFasciaBack : true;
            if (document.getElementById('fascia-left-check')) document.getElementById('fascia-left-check').checked = (data.showFasciaLeft !== undefined) ? data.showFasciaLeft : true;
            if (document.getElementById('fascia-right-check')) document.getElementById('fascia-right-check').checked = (data.showFasciaRight !== undefined) ? data.showFasciaRight : true;

            if (data.fasciaText !== undefined && document.getElementById('fascia-text-input')) {
                document.getElementById('fascia-text-input').value = data.fasciaText;
            }

            if (data.walls) {
                if (document.getElementById('wall-back-check')) document.getElementById('wall-back-check').checked = !!data.walls.back;
                if (document.getElementById('wall-left-check')) document.getElementById('wall-left-check').checked = !!data.walls.left;
                if (document.getElementById('wall-right-check')) document.getElementById('wall-right-check').checked = !!data.walls.right;
                if (document.getElementById('wall-front-check')) document.getElementById('wall-front-check').checked = !!data.walls.front;
            }

            disabledWallSegments = data.disabledWallSegments || [];
            elevatedWallSegments = data.elevatedWallSegments || {};

            render3DFloor();

            draggableObjects.forEach(obj => scene.remove(obj));
            draggableObjects.length = 0;
            if (data.objects && data.objects.length > 0) {
                data.objects.forEach(o => {
                    createObject(o.type, o.position, o.rotation, false, o.images, o.hasTopLayer, o.shelfLayers, o.customDims);
                });
            }
        }

        function exportJSON() {
            saveToLocalStorage();
            let data = getCurrentSceneData();
            let blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
            let a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `EXPO_Booth_Config_${Date.now()}.json`;
            a.click();
        }

        function importJSON(event) {
            let file = event.target.files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = function(e) {
                try {
                    let parsed = JSON.parse(e.target.result);
                    // 相容桌面版或多方案備份包結構
                    let targetData = parsed.projects ? (parsed.projects[parsed.currentProjectId] || Object.values(parsed.projects)[0]) : parsed;
                    if (targetData) {
                        applyProjectDataToScene(targetData);
                        saveToLocalStorage();
                        alert('配置匯入成功！');
                    }
                } catch(err) {
                    alert('匯入失敗：檔案格式不正確');
                }
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        function resetWholeBooth() {
            if (confirm('確定要清空所有展具並重設攤位嗎？此操作無法還原。')) {
                clearAllFloors();
                document.getElementById('fascia-text-input').value = 'COMPRESSPORT';
                currentFloorColorHex = '#2d2d2d';
                document.getElementById('floor-color-input').value = '#2d2d2d';
                saveToLocalStorage();
            }
        }

        function exportImage() {
            selectObject(null);
            renderer.render(scene, camera);
            let a = document.createElement('a');
            a.href = renderer.domElement.toDataURL("image/png");
            a.download = `EXPO_Capture_${Date.now()}.png`;
            a.click();
        }

        function updateStructureUI() {
            render3DFloor();
            saveToLocalStorage();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            orbitControls.update();
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
